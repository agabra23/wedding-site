name: ci

# Runs on every PR (into dev or main) and on pushes to dev. No Azure access needed.
# Job names are the required status checks for branch protection: site, api, infra-validate.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    env:
      COSMOS_IMAGE: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    steps:
      - uses: actions/checkout@v4
      # A service container is pulled fresh on every run, so keep the 2 GB image as a cached tarball instead.
      # Bump the key suffix to pick up a newer vnext-preview image.
      - name: Cache Cosmos emulator image
        id: cosmos-cache
        uses: actions/cache@v4
        with:
          path: ~/cosmos-emulator.tar
          key: cosmos-emulator-vnext-preview-v1
      - name: Load or pull Cosmos emulator image
        run: |
          if [ -f ~/cosmos-emulator.tar ]; then
            docker load -i ~/cosmos-emulator.tar
          else
            docker pull "$COSMOS_IMAGE"
            docker save -o ~/cosmos-emulator.tar "$COSMOS_IMAGE"
          fi
      - name: Start Cosmos emulator
        run: docker run -d --name cosmos -p 8081:8081 "$COSMOS_IMAGE"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build api/WeddingApi -c Release
      - name: Wait for Cosmos emulator
        run: timeout 120 bash -c 'until curl -sf http://localhost:8081/ >/dev/null; do sleep 3; done'
      - name: API tests
        run: dotnet test api/WeddingApi.Tests
      - name: Docker image builds
        run: docker build api/WeddingApi

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra
      - run: terraform init -backend=false
        working-directory: infra
      - run: terraform validate
        working-directory: infra
