name: site-dev

# Deploys the site to the dev Static Web App (swa-wedding-dev), pointed at the dev API.
on:
  push:
    branches: [dev]
    paths-ignore: ['api/**', 'infra/**', '.github/workflows/api.yml', '.github/workflows/api-dev.yml', '.github/workflows/infra.yml', '**/*.md']
  workflow_dispatch:

permissions:
  id-token: write # OIDC sign-in to Azure
  contents: read

concurrency:
  group: site-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The dev API host is generated by Azure, so look it up instead of hardcoding it
      - name: Get dev API URL
        run: |
          fqdn=$(az containerapp show --name ca-wedding-api-dev --resource-group rg-wedding \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "VITE_API_URL=https://$fqdn" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # VITE_API_URL from the step above overrides .env.production

      - name: Get Static Web App deployment token
        run: |
          token=$(az staticwebapp secrets list --name swa-wedding-dev --resource-group rg-wedding \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          api_location: ''
