name: site

on:
  push:
    branches: [main]
    paths-ignore: ['api/**', 'infra/**', '.github/workflows/api.yml', '.github/workflows/infra.yml', '**/*.md']
  workflow_dispatch:

permissions:
  id-token: write # OIDC sign-in to Azure
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # reads .env.production

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Fetched at deploy time via OIDC, so no long-lived token is stored in GitHub
      - name: Get Static Web App deployment token
        run: |
          token=$(az staticwebapp secrets list --name swa-wedding --resource-group rg-wedding \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          api_location: ''
